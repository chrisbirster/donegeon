name: M3 implementation bootstrap

on:
  push:
    branches:
      - DGN-0019-m3-scheduling-reminders

permissions:
  contents: write

jobs:
  implement-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply M3 implementation once
        if: ${{ hashFiles('internal/database/migrations/000017_task_reminder_at.up.sql') == '' }}
        run: python3 scripts/m3_implementation.py
      - name: Format Go
        run: gofmt -w internal/task internal/httpapi
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No implementation diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement M3 scheduling reminders'
          git push origin HEAD:DGN-0019-m3-scheduling-reminders
      - name: Go tests
        run: go test ./...
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Web typecheck
        working-directory: web
        run: npm run typecheck
      - name: Web unit tests
        working-directory: web
        run: npm --workspace @donegeon/client run test:unit
