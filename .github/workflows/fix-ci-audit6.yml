name: Fix CI audit 6 (one-off)

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/fix-ci-audit6.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore solid rc.0 manifests and lockfile from main, then pin seroval
        working-directory: web
        run: |
          git checkout origin/main -- package.json package-lock.json apps/client/package.json apps/marketing/package.json
          npm pkg set 'overrides.seroval=1.6.9' 'overrides.seroval-plugins=1.6.9'
          rm -rf node_modules apps/*/node_modules package-lock.json
          npm install
          npm ls seroval || true
          npm ls seroval seroval-plugins solid-js @solidjs/web || true
          npm audit fix || true
          npm audit --omit=dev --audit-level=high
          npm run typecheck --workspaces --if-present
          npm test --workspaces --if-present
          npm run build --workspaces --if-present
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json web/apps/client/package.json web/apps/marketing/package.json
          git commit -m "fix(ci): keep solid rc.0, pin seroval 1.6.9 via override"
          git push origin HEAD:${{ github.ref_name }}
