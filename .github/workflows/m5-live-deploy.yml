name: M5 Live Deploy

on:
  push:
    branches:
      - deploy/m5-live-test
    paths:
      - .github/workflows/m5-live-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact M5 test head
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test server changes
        run: go test ./internal/httpapi ./internal/config

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build embedded client assets
        working-directory: web
        run: npm run build:client

      - name: Verify generated PWA artifacts exist
        run: |
          test -s web/dist/sw.js
          test -s web/dist/manifest.webmanifest

      - name: Install flyctl
        run: |
          set -euo pipefail
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy M5 app to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml

      - name: Verify live production
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 10 --retry-delay 3 --retry-all-errors -fsS https://app.donegeon.com/healthz | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl --retry 10 --retry-delay 3 --retry-all-errors -fsS https://app.donegeon.com/readyz | tee /tmp/ready.json
          grep -q '"status":"ok"' /tmp/ready.json
          curl -fsS https://app.donegeon.com/api/public/config | tee /tmp/config.json
          grep -q '"openBeta":true' /tmp/config.json
          curl -fsSI https://app.donegeon.com/sw.js | tee /tmp/sw.headers
          grep -Eiq '^content-type: (text|application)/(javascript|x-javascript)' /tmp/sw.headers
          curl -fsSI https://app.donegeon.com/manifest.webmanifest | tee /tmp/manifest.headers
          ! grep -Eiq '^content-type: text/html' /tmp/manifest.headers
