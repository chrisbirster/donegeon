name: M3 Remediation Audit

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: m3-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m3:
    name: M3 browser audit (non-certified)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: web/apps/client
        run: npx --no-install playwright install --with-deps chromium

      - name: Run M3 scheduling + reminder audit without certifying M3
        working-directory: web/apps/client
        run: npm run test:audit:m3 -- --max-failures=1 --retries=0
