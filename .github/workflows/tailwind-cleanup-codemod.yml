name: Tailwind Cleanup Codemod

on:
  push:
    branches:
      - DGN-0018-m2-organization-remediation

permissions:
  contents: write

jobs:
  codemod:
    if: contains(github.event.head_commit.message, 'Run Tailwind cleanup codemod')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: DGN-0018-m2-organization-remediation
      - name: Replace legacy Board utility-class helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('web/apps/client/src/features/board/board-model.ts')
          text = path.read_text()
          if 'import { css } from "@linaria/core";' not in text:
              text = 'import { css } from "@linaria/core";\n' + text

          token_old = '''export function tokenClass(kind: TokenKind): string {
            switch (kind) {
              case "project":
                return "text-[#ffd2d2] bg-[#7f1d1d]";
              case "label":
                return "text-[#ffdff5] bg-[#6b214d]";
              case "assignee":
                return "text-[#fbe2ff] bg-[#5b2470]";
              case "priority":
                return "text-[#ffe5d5] bg-[#9a3412]";
              case "deadline":
                return "text-[#e3dcff] bg-[#4338ca]";
              case "recurrence":
                return "text-[#d8ffd4] bg-[#14532d]";
              case "due":
                return "text-[#ffe6cc] bg-[#92400e]";
              default:
                return "text-[var(--text-main)]";
            }
          }
          '''
          token_new = '''const boardTokenProject = css`border-radius:.28rem; background:#7f1d1d; color:#ffd2d2;`;
          const boardTokenLabel = css`border-radius:.28rem; background:#6b214d; color:#ffdff5;`;
          const boardTokenAssignee = css`border-radius:.28rem; background:#5b2470; color:#fbe2ff;`;
          const boardTokenPriority = css`border-radius:.28rem; background:#9a3412; color:#ffe5d5;`;
          const boardTokenDeadline = css`border-radius:.28rem; background:#4338ca; color:#e3dcff;`;
          const boardTokenRecurrence = css`border-radius:.28rem; background:#14532d; color:#d8ffd4;`;
          const boardTokenDue = css`border-radius:.28rem; background:#92400e; color:#ffe6cc;`;
          const boardTokenText = css`color:var(--text-main);`;

          export function tokenClass(kind: TokenKind): string {
            switch (kind) {
              case "project": return boardTokenProject;
              case "label": return boardTokenLabel;
              case "assignee": return boardTokenAssignee;
              case "priority": return boardTokenPriority;
              case "deadline": return boardTokenDeadline;
              case "recurrence": return boardTokenRecurrence;
              case "due": return boardTokenDue;
              default: return boardTokenText;
            }
          }
          '''
          if token_old not in text:
              raise SystemExit('expected tokenClass block not found')
          text = text.replace(token_old, token_new)

          tone_old = '''export function notificationToneClass(tone: string | undefined): string {
            switch ((tone ?? "").trim().toLowerCase()) {
              case "success":
                return "border-[rgba(70,140,98,0.34)] bg-[var(--success-bg)] text-[var(--success)]";
              case "error":
                return "border-[rgba(196,98,91,0.28)] bg-[var(--danger-bg)] text-[var(--danger)]";
              default:
                return "border-[var(--border-strong)] bg-[var(--panel-soft)] text-[var(--text-main)]";
            }
          }
          '''
          tone_new = '''const notificationSuccess = css`border-color:rgba(70,140,98,.34); background:var(--success-bg); color:var(--success);`;
          const notificationError = css`border-color:rgba(196,98,91,.28); background:var(--danger-bg); color:var(--danger);`;
          const notificationInfo = css`border-color:var(--border-strong); background:var(--panel-soft); color:var(--text-main);`;

          export function notificationToneClass(tone: string | undefined): string {
            switch ((tone ?? "").trim().toLowerCase()) {
              case "success": return notificationSuccess;
              case "error": return notificationError;
              default: return notificationInfo;
            }
          }
          '''
          if tone_old not in text:
              raise SystemExit('expected notificationToneClass block not found')
          text = text.replace(tone_old, tone_new)
          path.write_text(text)

          pattern = re.compile(r'\b(?:bg|text|border|rounded|shadow|ring|outline|tracking|leading|w|h|min-w|max-w|min-h|max-h|p[trblxy]?|m[trblxy]?|gap|grid-cols|z|inset)-\[[^\]]+\]')
          matches = []
          for source in Path('web/apps/client/src').rglob('*'):
              if source.suffix not in {'.ts', '.tsx', '.css'}:
                  continue
              for lineno, line in enumerate(source.read_text(errors='ignore').splitlines(), 1):
                  if pattern.search(line):
                      matches.append(f'{source}:{lineno}: {line.strip()}')
          print('Remaining arbitrary utility-class patterns:')
          print('\n'.join(matches) if matches else 'none')
          PY
      - name: Commit codemod
        run: |
          git config user.name "donegeon-ci"
          git config user.email "actions@users.noreply.github.com"
          git add web/apps/client/src/features/board/board-model.ts
          git commit -m "Style: replace Board Tailwind utility helpers"
          git push origin HEAD:DGN-0018-m2-organization-remediation
