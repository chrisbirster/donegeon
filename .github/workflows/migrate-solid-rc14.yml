name: Migrate vite8 solid rc14 (one-off)

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/migrate-solid-rc14.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bump manifests
        working-directory: web
        run: |
          node -e '
          const fs=require("fs");
          const edit=(f,fn)=>{const j=JSON.parse(fs.readFileSync(f,"utf8"));fn(j);fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n")};
          const setv=(j,name,v)=>{for(const s of ["dependencies","devDependencies"]){if(j[s]&&j[s][name]!==undefined)j[s][name]=v}};
          edit("package.json",j=>{delete j.overrides});
          for(const f of ["apps/client/package.json","apps/marketing/package.json"]) edit(f,j=>{
            setv(j,"solid-js","2.0.0-rc.14");
            setv(j,"@solidjs/web","2.0.0-rc.14");
            setv(j,"@solidjs/router","2.0.0-next.38");
            setv(j,"@tanstack/solid-query","6.0.0-rc.5");
            setv(j,"vite","^8.3.4");
            setv(j,"vite-plugin-pwa","^2.0.0");
          });
          '
          git diff --stat
      - name: Reinstall and lock
        working-directory: web
        run: |
          rm -rf node_modules apps/*/node_modules package-lock.json
          npm install 2>&1 | tail -40
          npm ls solid-js @solidjs/web vite @solidjs/vite-plugin seroval 2>&1 | head -40 || true
          npm audit --omit=dev --audit-level=high || true
      - name: Typecheck
        working-directory: web
        continue-on-error: true
        run: npm run typecheck --workspaces --if-present 2>&1 | tail -150
      - name: Build
        working-directory: web
        continue-on-error: true
        run: npm run build --workspaces --if-present 2>&1 | tail -100
      - name: Commit manifests and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json web/apps/client/package.json web/apps/marketing/package.json
          git commit -m "chore(web): vite 8 and solid-js 2.0.0-rc.14 manifests" || echo nothing
          git push origin HEAD:${{ github.ref_name }}
