name: Generate Infra Lockfile

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: infra-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: github.head_ref == 'DGN-0004-open-source-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout readiness branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate infra lockfile
        working-directory: infra
        run: npm install --no-audit --no-fund

      - name: Validate upgraded infrastructure
        working-directory: infra
        run: |
          npx --no-install sst install
          npm run check
          npm audit --omit=dev --audit-level=high

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- infra/package-lock.json)" ]; then
            echo "infra/package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/package-lock.json
          git commit -m "chore: update infra npm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
