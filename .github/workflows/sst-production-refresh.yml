name: One-time SST production state migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: donegeon-production-sst
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh SST production state
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci --no-audit --no-fund

      - name: Refresh production SST state
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          DONEGEON_MARKETING_DOMAIN: ${{ vars.DONEGEON_MARKETING_DOMAIN }}
          DONEGEON_EMAIL_SENDER: ${{ vars.DONEGEON_EMAIL_SENDER }}
          DONEGEON_EMAIL_FROM: ${{ vars.DONEGEON_EMAIL_FROM }}
          DONEGEON_EMAIL_API_AUTH_HEADER: ${{ vars.DONEGEON_EMAIL_API_AUTH_HEADER }}
        run: |
          set -euo pipefail
          npx --no-install sst refresh --stage production
