name: Merge main into migration (one-off)

on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/merge-main.yml']

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main keeping branch side for conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge origin/main -X ours -m "Merge main into migration branch" || { git status --short | head -20; exit 1; }
          git diff origin/main --stat | tail -5
          git push origin HEAD:${{ github.ref_name }}
