version: '3'

tasks:
  default:
    desc: Start development environment
    cmds:
      - task: dev

  dev:
    desc: Run backend and frontend dev servers concurrently
    deps:
      - dev:backend
      - dev:frontend

  dev:backend:
    desc: Run Go API with hot reload (air). Loads .env and enables OTP debug code by default.
    preconditions:
      - sh: command -v air >/dev/null 2>&1
        msg: air is required. Install it with `task install:air`.
    cmds:
      - |
        set -a
        [ -f .env ] && . ./.env
        set +a
        : "${DONEGEON_AUTH_DEBUG_CODE:=true}"
        : "${DONEGEON_REQUIRE_AUTH:=true}"
        export DONEGEON_AUTH_DEBUG_CODE DONEGEON_REQUIRE_AUTH
        echo "starting backend (DONEGEON_AUTH_DEBUG_CODE=${DONEGEON_AUTH_DEBUG_CODE})"
        air -c .air.toml

  dev:frontend:
    desc: Run web dev server (bun + turbo + vite). Waits for API health.
    dir: web
    preconditions:
      - sh: command -v bun >/dev/null 2>&1
        msg: bun is required. Install bun first.
      - sh: command -v curl >/dev/null 2>&1
        msg: curl is required to wait for backend readiness.
    cmds:
      - |
        echo "waiting for backend on http://localhost:42069/api/health ..."
        until curl -sf http://localhost:42069/api/health >/dev/null; do
          sleep 0.2
        done
        bun run dev

  dev:marketing:
    desc: Run marketing app only (Vite SPA)
    dir: web/apps/marketing
    preconditions:
      - sh: command -v bun >/dev/null 2>&1
        msg: bun is required. Install bun first.
    cmds:
      - bun run dev

  install:
    desc: Install all local development dependencies
    cmds:
      - task: install:air
      - task: install:web

  install:air:
    desc: Install or update air
    cmds:
      - go install github.com/air-verse/air@latest

  install:web:
    desc: Install web dependencies
    dir: web
    cmds:
      - bun install

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  build:
    desc: Build frontend and backend
    cmds:
      - task: build:web
      - go build ./...

  build:web:
    desc: Build frontend assets into web/dist
    dir: web
    cmds:
      - bun run build

  build:marketing:
    desc: Build only marketing SPA (web/apps/marketing/dist)
    dir: web
    preconditions:
      - sh: command -v bun >/dev/null 2>&1
        msg: bun is required. Install bun first.
    cmds:
      - bun run build --filter=@donegeon/marketing

  deploy:app:
    desc: Deploy app.donegeon.com backend to Fly
    preconditions:
      - sh: command -v flyctl >/dev/null 2>&1
        msg: flyctl is required. Install Fly CLI first.
    cmds:
      - flyctl deploy

  deploy:app:secrets:
    desc: Set app secrets from .env on Fly (best-effort; skips blank lines/comments)
    preconditions:
      - sh: command -v flyctl >/dev/null 2>&1
        msg: flyctl is required. Install Fly CLI first.
      - sh: test -f .env
        msg: .env not found at repo root.
    cmds:
      - |
        while IFS='=' read -r key value; do
          [ -z "$key" ] && continue
          case "$key" in \#*) continue ;; esac
          [ -z "$value" ] && continue
          flyctl secrets set "$key=$value" >/dev/null || true
        done < .env
        echo "done: attempted to sync non-empty .env keys to Fly secrets"

  deploy:infra:
    desc: Deploy SST infra to production (email API + marketing site)
    dir: infra
    dotenv:
      - .env
    preconditions:
      - sh: command -v bun >/dev/null 2>&1
        msg: bun is required. Install bun first.
      - sh: test -f .env
        msg: infra/.env not found. Copy from .env.example and fill in values.
    cmds:
      - bun install
      - bunx sst deploy --stage production

  deploy:infra:dev:
    desc: Deploy SST infra to dev stage (email API + marketing site)
    dir: infra
    dotenv:
      - .env
    preconditions:
      - sh: command -v bun >/dev/null 2>&1
        msg: bun is required. Install bun first.
      - sh: test -f .env
        msg: infra/.env not found. Copy from .env.example and fill in values.
    cmds:
      - bun install
      - bunx sst deploy --stage dev

  deploy:infra:remove:
    desc: Remove SST infra stack
    dir: infra
    dotenv:
      - .env
    preconditions:
      - sh: command -v bun >/dev/null 2>&1
        msg: bun is required. Install bun first.
    cmds:
      - bunx sst remove --stage production

  deploy:marketing:
    desc: Deploy marketing site via SST (production)
    cmds:
      - task: deploy:infra

  deploy:marketing:dev:
    desc: Deploy marketing site via SST (dev stage)
    cmds:
      - task: deploy:infra:dev
