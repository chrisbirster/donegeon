version: '3'

tasks:
  default:
    desc: Start development environment
    cmds:
      - task: dev

  dev:
    desc: Run backend and frontend dev servers concurrently
    deps:
      - dev:backend
      - dev:frontend

  dev:backend:
    desc: Run Go API with hot reload (air)
    preconditions:
      - sh: command -v air >/dev/null 2>&1
        msg: air is required. Install it with `task install:air`.
    cmds:
      - air -c .air.toml

  dev:frontend:
    desc: Run web dev server (bun + turbo + vite)
    dir: web
    preconditions:
      - sh: command -v bun >/dev/null 2>&1
        msg: bun is required. Install bun first.
      - sh: command -v curl >/dev/null 2>&1
        msg: curl is required to wait for backend readiness.
    cmds:
      - |
        echo "waiting for backend on http://localhost:42069/api/health ..."
        until curl -sf http://localhost:42069/api/health >/dev/null; do
          sleep 0.2
        done
        bun run dev

  install:
    desc: Install all local development dependencies
    cmds:
      - task: install:air
      - task: install:web

  install:air:
    desc: Install or update air
    cmds:
      - go install github.com/air-verse/air@latest

  install:web:
    desc: Install web dependencies
    dir: web
    cmds:
      - bun install

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  build:
    desc: Build frontend and backend
    cmds:
      - task: build:web
      - go build ./...

  build:web:
    desc: Build frontend assets into web/dist
    dir: web
    cmds:
      - bun run build

  deploy:infra:
    desc: Deploy SST infra (loads infra/.env automatically)
    dir: infra
    dotenv:
      - .env
    preconditions:
      - sh: command -v bun >/dev/null 2>&1
        msg: bun is required. Install bun first.
      - sh: test -f .env
        msg: infra/.env not found. Copy from .env.example and fill in values.
    cmds:
      - bun install
      - bunx sst deploy --stage production

  deploy:infra:dev:
    desc: Deploy SST infra to dev stage (loads infra/.env)
    dir: infra
    dotenv:
      - .env
    preconditions:
      - sh: command -v bun >/dev/null 2>&1
        msg: bun is required. Install bun first.
      - sh: test -f .env
        msg: infra/.env not found. Copy from .env.example and fill in values.
    cmds:
      - bun install
      - bunx sst deploy --stage dev

  deploy:infra:remove:
    desc: Remove SST infra stack
    dir: infra
    dotenv:
      - .env
    preconditions:
      - sh: command -v bun >/dev/null 2>&1
        msg: bun is required. Install bun first.
    cmds:
      - bunx sst remove --stage production
